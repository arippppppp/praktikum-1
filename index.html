<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="desain index.css">
</head>
<body>

<div class="wrapper">`
    <form onsubmit="simpanData(event)">
        <h1>Register Form</h1>

        <div class="input-box">
            <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="number" id="umur" placeholder="Umur" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="input-box">
            <input type="text" id="alamat" placeholder="Alamat" required>
        </div>

        <div class="input-box">
            <input type="number" id="nohp" placeholder="Nomor HP" required>
        </div>

        <div class="input-box">
            <input type="text" id="hobi" placeholder="Hobi" required>
        </div>

        <div class="input-box">
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <button type="submit" class="btn">Register</button>
    </form>
</div>

<script>
function simpanData(event) {
    event.preventDefault();

    localStorage.setItem("username", document.getElementById("username").value);
    localStorage.setItem("umur", document.getElementById("umur").value);
    localStorage.setItem("password", document.getElementById("password").value);
    localStorage.setItem("alamat", document.getElementById("alamat").value);
    localStorage.setItem("nohp", document.getElementById("nohp").value);
    localStorage.setItem("hobi", document.getElementById("hobi").value);
    localStorage.setItem("email", document.getElementById("email").value);

    window.location.href = "biodata.html";
}
</script>

</body>
</html>
